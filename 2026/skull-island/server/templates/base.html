<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Skull Island Map{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <img src="{{ url_for('static', filename='mascot.png') }}" height="50px" alt="Pico le Croco">
                <span class="brand-text"><a href="{{ url_for('dashboard') }}" class="nav-link">Skull Island
                        Map</a></span>
            </div>
            {% if session.get('username') %}
            <div class="nav-menu">
                <span class="welcome-text">Ahoy, {{ session.get('username') }}!</span>
                <a href="{{ url_for('logout') }}" class="nav-link logout-btn">Logout</a>
            </div>
            {% endif %}
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>⚓ Navigate these waters wisely. Beware the Kraken! ⚓</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>

</html>
